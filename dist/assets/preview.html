:root{--bg:#14121f;--panel:#1f1c30;--ink:#f4f1ff;--muted:#a49fc2;--accent:#8b5cf6;--accent-deep:#5b30c9}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,sans-serif}
header{display:flex;align-items:center;gap:12px;padding:12px 16px;background:var(--panel)}
header b{font-size:18px;letter-spacing:.5px}header .tag{margin-left:auto;font-size:12px;padding:3px 8px;border-radius:99px;background:var(--accent);color:#fff}
main{display:flex;gap:16px;justify-content:center;padding:16px}
.col{flex:1;max-width:1100px;min-width:0}
.frame{position:relative;width:100%;aspect-ratio:16/9;background:#000;border-radius:14px;overflow:hidden;box-shadow:0 6px 0 var(--accent-deep)}
.frame iframe{position:absolute;inset:0;width:100%;height:100%;border:0;display:block}
.bar{display:flex;gap:8px;align-items:center;margin-top:12px}
.bar h1{font-size:20px;margin:0;flex:1}
button{font:inherit;border:0;border-radius:10px;padding:8px 12px;background:var(--accent);color:#fff;cursor:pointer;box-shadow:0 3px 0 var(--accent-deep)}
aside{display:none;width:300px;min-height:600px;border:2px dashed var(--muted);border-radius:12px;color:var(--muted);align-items:center;justify-content:center;text-align:center}
@media (min-width:1200px){aside{display:flex}}
#log{margin-top:12px;font:12px ui-monospace,monospace;color:var(--muted);white-space:pre-wrap;max-height:160px;overflow:auto}
